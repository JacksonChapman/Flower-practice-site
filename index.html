<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowers by Me — Florist in Casper, Wyoming</title>
    <meta
      name="description"
      content="Flowers by Me is a small florist studio in Casper, Wyoming. Wildflower bouquets, wedding and event florals, sympathy arrangements, subscriptions and seasonal workshops. Same-day Casper delivery."
    />
    <meta name="theme-color" content="#FBF7F1" />

    <!-- Social preview (swap the image URL for a real photo before launch) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flowers by Me — Florist in Casper, Wyoming" />
    <meta
      property="og:description"
      content="Wyoming blooms, delivered with heart. Hand-tied wildflower bouquets, wedding florals and workshops in Casper, WY."
    />
    <meta property="og:image" content="https://picsum.photos/seed/fbm-hero/1200/630" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    />

    <!-- Local business structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Florist",
        "name": "Flowers by Me",
        "description": "Rustic-romantic floral studio in Casper, Wyoming.",
        "telephone": "+1-307-555-0148",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "214 S. Wolcott St",
          "addressLocality": "Casper",
          "addressRegion": "WY",
          "postalCode": "82601",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "17:00"
          }
        ],
        "sameAs": ["https://instagram.com/flowersbyme.casper"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
